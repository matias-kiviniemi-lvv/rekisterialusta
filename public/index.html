<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rekisterialusta | Lupa- ja valvontavirasto</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/lvv-logo.png" alt="Lupa- ja valvontavirasto" />
      <div class="service-name">
        <div class="brand-title">Rekisterialusta</div>
        <div class="brand-sub">Asiointi- ja käsittelypalvelu</div>
      </div>
    </div>
    <div class="context">
      <label>Acting as
        <select id="identity"></select>
      </label>
      <label>Registry
        <select id="registry"></select>
      </label>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="customer" class="active">Customer portal</button>
    <button data-tab="worker">Case-worker portal</button>
    <button data-tab="publishing">Publishing portal</button>
    <button data-tab="management">Management portal</button>
  </nav>

  <main id="view"></main>

  <div id="toast" class="toast" hidden></div>

  <footer class="foot">
    <span class="foot-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span>Development environment · data resets when the server restarts · switch “Acting as” to test roles and permissions.</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
